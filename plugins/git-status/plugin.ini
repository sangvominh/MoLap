[plugin]
id = git-status
name = Git Status
author = MoLap
version = 0.2.0
description = Active repository branch, dirty working tree count, and latest commit
interval = 10
command = powershell -NoProfile -ExecutionPolicy Bypass -File run.ps1
action_label = Fetch
action_command = powershell -NoProfile -ExecutionPolicy Bypass -File run.ps1 -Fetch
